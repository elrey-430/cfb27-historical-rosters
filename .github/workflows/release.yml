name: Release

# Builds the Windows release and publishes it here.
#
# The source lives in elrey-430/cfb27-roster-generator. Because that
# repository is public it can be checked out with no credentials, and the
# release is created in *this* repository — so the job runs on the built-in
# GITHUB_TOKEN and needs no personal access token. Running it the other way
# round would need one, since a workflow's own token cannot create a release
# in a different repository.
#
# Building on windows-latest rather than cross-compiling means the binaries
# that reach users are produced on the platform they run on, the test suite
# runs there, and the executable is launched there before packaging.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.3.0-alpha'
        required: true
        default: '0.3.0-alpha'
      source_ref:
        description: 'Branch or tag of cfb27-roster-generator to build'
        required: true
        default: 'main'
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      SOURCE_REPO: elrey-430/cfb27-roster-generator
      PACKAGE: CFB27-Roster-Generator-${{ inputs.version }}-win-x64

    steps:
      # This repository, for the release notes and the templates.
      - uses: actions/checkout@v4
        with:
          path: dist-repo

      - uses: actions/checkout@v4
        with:
          repository: elrey-430/cfb27-roster-generator
          ref: ${{ inputs.source_ref }}
          path: source

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Only to run npm here. The runtime that SHIPS is downloaded below and
      # pinned; this one never leaves the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A release that fails its own tests should never reach a user.
      - name: Test
        working-directory: source
        run: dotnet test --configuration Release --nologo

      - name: Publish
        shell: pwsh
        working-directory: source
        run: |
          $out = "$env:GITHUB_WORKSPACE/dist/$env:PACKAGE"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $common = @(
            '--configuration', 'Release',
            '--runtime', 'win-x64',
            '--self-contained',
            '-p:PublishSingleFile=true',
            '-p:EnableCompressionInSingleFile=true',
            '-p:DebugType=none',
            '-p:GenerateDocumentationFile=false',
            "-p:Version=${{ inputs.version }}",
            '--nologo'
          )
          dotnet publish src/RosterGenerator.Gui @common --output $out
          dotnet publish src/RosterGenerator.Cli @common --output $out
          Copy-Item QUICKSTART.md "$out/README.txt"

      # The save reader: the scripts the app calls, their dependencies, and a
      # private copy of the Node runtime so the user installs nothing. Without
      # this the release cannot open a dynasty save at all.
      - name: Bundle the save reader
        shell: pwsh
        working-directory: source/tools/native-save
        run: |
          npm install --omit=dev --no-audit --no-fund
          $tools = "$env:GITHUB_WORKSPACE/dist/$env:PACKAGE/tools/native-save"
          New-Item -ItemType Directory -Force -Path "$tools/runtime" | Out-Null
          # Only the four scripts the application calls; the rest of the folder
          # is the rig the save format was worked out with.
          Copy-Item extract.mjs, apply.mjs, save.mjs, csv.mjs, package.json, README.md -Destination $tools
          Copy-Item node_modules -Destination "$tools/node_modules" -Recurse

          $nodeVersion = 'v22.23.1'   # LTS "Jod"; the library needs >= 22.19
          $base = "https://nodejs.org/dist/$nodeVersion"
          Invoke-WebRequest "$base/win-x64/node.exe" -OutFile "$tools/runtime/node.exe"
          Invoke-WebRequest "$base/SHASUMS256.txt"   -OutFile "$env:RUNNER_TEMP/SHASUMS256.txt"
          Invoke-WebRequest "https://raw.githubusercontent.com/nodejs/node/$nodeVersion/LICENSE" `
              -OutFile "$tools/runtime/LICENSE-nodejs.txt"

          # Verified against nodejs.org's own checksums. A binary this project
          # ships to users is not taken on trust.
          $expected = (Select-String -Path "$env:RUNNER_TEMP/SHASUMS256.txt" -Pattern 'win-x64/node\.exe').Line.Split(' ')[0]
          $actual = (Get-FileHash "$tools/runtime/node.exe" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) {
            throw "node.exe checksum mismatch: expected $expected, got $actual"
          }
          Write-Host "Node $nodeVersion bundled and verified ($actual)"

      # Proves the executable actually starts on Windows.
      - name: Smoke test on Windows
        shell: pwsh
        working-directory: source
        run: |
          $exe = "$env:GITHUB_WORKSPACE/dist/$env:PACKAGE/RosterGenerator.Cli.exe"
          & $exe validate --roster Tests/2023_FSU_Input.csv
          if ($LASTEXITCODE -ne 0) { throw "validate exited $LASTEXITCODE" }
          & $exe list-teams --dynasty Tests/DonorDynasty | Select-Object -First 5
          if ($LASTEXITCODE -ne 0) { throw "list-teams exited $LASTEXITCODE" }

          # Generate a period roster end to end, so the release cannot ship
          # with the equipment data file missing from the package.
          $out = "$env:RUNNER_TEMP/smoke"
          & $exe generate --dynasty Tests/EquipmentDynasty --roster Tests/2023_FSU_Input.csv `
              --team "Florida State" --season 1985 `
              --output "$out/roster.csv" --report "$out/report.txt" `
              --equipment-output "$out/equipment.csv"
          if ($LASTEXITCODE -ne 0) { throw "generate exited $LASTEXITCODE" }
          if (-not (Test-Path "$out/equipment.csv")) { throw "no equipment table was written" }
          if (-not (Select-String -Path "$out/equipment.csv" -Pattern "GearHelmet_RiddellTK" -Quiet)) {
            throw "the 1985 roster is not wearing period helmets"
          }
          Write-Host "equipment smoke test passed"

          # The bundled runtime has to actually run on Windows. The release is
          # built on Linux during development, where that cannot be checked.
          $node = "$env:GITHUB_WORKSPACE/dist/$env:PACKAGE/tools/native-save/runtime/node.exe"
          $runtimeVersion = & $node --version
          if ($LASTEXITCODE -ne 0) { throw "the bundled node.exe did not run" }
          Write-Host "bundled runtime: $runtimeVersion"

          # And it has to load the save-format library, which is what proves
          # node_modules survived packaging. Run from the tools folder so the
          # module resolves exactly as it will for a user.
          Push-Location "$env:GITHUB_WORKSPACE/dist/$env:PACKAGE/tools/native-save"
          & $node -e "const m = require('madden-franchise'); if (!m.FranchiseFile) { throw new Error('no FranchiseFile export'); } console.log('save reader loads');"
          $loaded = $LASTEXITCODE
          Pop-Location
          if ($loaded -ne 0) { throw "the save reader could not be loaded" }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip"

      # Kept alongside the release: it is the fallback download if publishing
      # ever fails, and it survives a deleted release.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}.zip
          retention-days: 30

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Both checkouts live in subdirectories, so the working directory is
          # not a git repository and gh cannot infer which repo to act on. It
          # fails in a couple of seconds with "failed to determine base
          # repository", which reads like an auth problem and is not one.
          GH_REPO: ${{ github.repository }}
        run: |
          $releaseArgs = @(
            'release', 'create', "v${{ inputs.version }}",
            "dist/$env:PACKAGE.zip",
            '--repo', '${{ github.repository }}',
            '--title', "v${{ inputs.version }}",
            '--notes-file', 'dist-repo/RELEASE_NOTES.md'
          )
          if ('${{ inputs.prerelease }}' -eq 'true') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
